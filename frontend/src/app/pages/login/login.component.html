<div class="auth-page">
    <p-card class="auth-card">
        <div class="header">
            <i class="pi pi-heart-fill hospital-icon"></i>

            <h1>Hospital</h1>

            <p>
                Inicie sesión para acceder a la gestión de usuarios.
            </p>
        </div>

        <form
            [formGroup]="form"
            (ngSubmit)="ingresar()"
            class="formulario"
        >
            <div class="campo">
                <label for="identificacion">
                    Número de identificación
                </label>

                <input
                    id="identificacion"
                    pInputText
                    type="text"
                    formControlName="identificacion"
                    (input)="soloDigitos($event)"
                >
            </div>

            <div class="campo">
                <label for="password">
                    Contraseña
                </label>

                <p-password
                    inputId="password"
                    formControlName="password"
                    [feedback]="false"
                    [toggleMask]="true"
                    styleClass="w-full"
                />
            </div>

            @if (errorMensaje) {
                <p-message severity="error">
                    <div class="mensaje-error">
                        {{ errorMensaje }}

                        @if (errorMensaje.includes('regístrese')) {
                            <a routerLink="/registro">
                                Regístrese
                            </a>
                        }
                    </div>
                </p-message>
            }

            <button
                pButton
                type="submit"
                label="Ingresar"
                [loading]="cargando()"
                [disabled]="form.invalid"
                class="w-full"
            ></button>

            <div class="enlace">
                ¿No tiene cuenta?
                <a routerLink="/registro">
                    Regístrese
                </a>
            </div>
        </form>
    </p-card>
</div>
