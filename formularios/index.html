<!DOCTYPE html>

<html lang="es">

<!-- Control + k + u -->
<!-- Control + a -->
<!-- Shift + alt + f -->
<!-- Control + k y Control + t -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0"> <!-- Vas a crear un viewport, de acuerdo
                                                                            que se cargue-->

    <title> Formulario HTML y CSS </title>
    <link rel="stylesheet" href="./css/styles.css">



</head>


<body>

    <main class="form-page">

        <section class="form-section">

            <div class="form-container">

                <header class="form-header">

                    <span class="eyebrow">
                        CONTACTO
                    </span>

                    <h1> Cuentanos sobre tu necesidad</h1>
                    <p>
                        Complete el formulario. Los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>

                </header>


                <form class="contact-form" action="#" method="POST">

                    <!-- Datos personales -->
                    <h2>
                        Datos personales
                    </h2>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="nombre"> Nombre
                                <span class="requerid-mark" aria-hidden="true">*</span>
                            </label> <!-- Muestran, no procesan-->
                            <input type="text" id="nombre" name="nombre" autocomplete="given-name" placeholder="Julieta"
                                required autocomplete="name">

                        </div>

                        <div class="form-field">
                            <label for="apellido">Apellido
                                <span class="requerid-mark" aria-hidden="true">*</span>
                            </label>
                            <input type="text" id="apellido" name="apellido" autocomplete="family-name"
                                placeholder="Martinez" required>
                        </div>

                    </div>


                    <div class="form-grid">

                        <div class="form-field">
                            <label for="email"> Correo electronico
                                <span class="requerid-mark" aria-hidden="true">
                                    *
                                </span>
                            </label>
                            <input type="email" id="email" name="email" placeholder="nombre@empresa.com"
                                autocomplete="email" required>

                        </div>


                        <div class="form-field">
                            <label for="telefono"> Telefono </label>
                            <input type="tel" id="telefono" name="telefono" placeholder="+57 300 000 0000"
                                autocomplete="tel">
                        </div>

                    </div>

                    <!-- Organizacion -->
                    <section class="form-block">

                        <h2>
                            Organización
                        </h2>

                        <div class="form-grid">

                            <div class="form-field">
                                <label for="empresa">Empresa</label>

                                <input type="text" id="empresa" name="empresa" placeholder="organization">

                            </div>

                            <div class="form-field">
                                <label for="empleados"> Numero de empleados</label>
                                <input type="number" id="empleados" name="empleados" min="1" step="1">

                            </div>

                        </div>


                        <div class="form-field">
                            <label for="servicio"> Servicio de interes</label>
                            <span class="requerid-mark" aria-hidden="true">*</span>
                            <select id="servicio" name="servicio" required>
                                <!-- parametros con las que actuara la lista-->

                                <option value="" selected disabled> Seleccione un Servicio</option>

                                <optgroup label="Auditorias de Seguridad">
                                    </option>
                                    <option value="pentesting">
                                        Pentesting web
                                    </option>
                                    <option value="hacking-etico">
                                        Hacking Ético
                                    </option>
                                    <option value="iso27001">
                                        ISO 27001
                                    </option>
                                </optgroup>

                                <optgroup label="Desarrollo seguro">
                                    <option value="ssdlc"> SSDLC </option>
                                    <option value="devsecops"> DevSevOps </option>
                                    <option value="ai-security"> AI Security </option>
                                </optgroup>
                                </optgroup>

                            </select>
                        </div>

                    </section>

                    <!-- Agenda -->

                    <section class="form-block">

                        <h2>
                            Disponibilidad
                        </h2>

                        <div class="form-grid">

                            <div class="form-field">
                                <label for="fecha"> Selecione fecha</label>
                                <input type="date" id="fecha" name="fecha">

                            </div>

                            <div class="form-field">
                                <label for="hora"> Seleccione hora</label>
                                <input type="time" id="hora" name="hora">

                            </div>
                        </div>

                    </section>

                    <!-- Modalidad -->

                    <fieldset>
                        <legend>
                            Modalidad de contacto
                        </legend>

                        <div class="choice-list">

                            <label class="choice">
                                <input type="radio" name="modalidad" value="correo" checked>
                                <span>
                                    Correo electronico
                                </span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="modalidad" value="telefono">
                                <span>
                                    Teléfono
                                </span>
                            </label>

                            <label class="choice">
                                <input type="radio" name="modalidad" value="videollamada">
                                <span>
                                    Video-llamada
                                </span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Intereses -->
                    <fieldset>
                        <legend>
                            Temas adicionales de interés
                        </legend>

                        <div class="choice-list">
                            <label class="choice">
                                <input type="checkbox" name="intereses" valor="ciberseguridad">
                                <span> Seguridad de aplicaciones </span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="intereses" valor="cloud"> <span> Cloud security </span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="intereses" valor="ia"> <span> AI security </span>
                            </label>
                        </div>
                    </fieldset>

                    <!-- Mensaje -->

                    <div class="form-field">
                        <label for="mensaje">
                            Describa su necesidad
                            <span class="required-mark" aria-hidden="true">*</span>

                        </label>
                            <textarea id="mensaje" name="mensaje" rows="7" maxlength="1200"
                                placeholder="Describa brevemente que necesitas..." required>
                        </textarea>

                            <small class="field-help">
                                Maximo 1200 caracteres
                            </small>
                        </div>

                        <!-- Archivo -->
                        <div class="form-field">
                            <label for="archivo"> Documento de soporte</label>
                            <input type="file" id="archivo" name="archivo" accept=".pdf, .docx, .xlsx, .xls">
                            <!-- Esto deberia hacerse desde el backend (accept)-->
                            <small class="field-help">
                                Formatos sugeridos: PDF, Word o Exel.
                            </small>
                        </div>

                        <!-- Terminos -->
                        <label class="choice">
                            <input type="checkbox" name="terminos" required>
                            <span> Acepto el tratamiento de la informacion suministrada </span>
                        </label>

                        <!-- Botones -->
                        <div class="form-actions">
                            <button type="submit" class="button button-primary">
                                Enviar solicitud
                            </button>
                            <button type="reset" class="button button-secondary">
                                Limpiar
                            </button>


                        </div>


                </form>

            </div>

        </section>

    </main>

</body>

</html>
