<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0"> <!-- Vas a crear un viewport, de acuerdo
                                                                            que se cargue-->

    <title> Ejercicio 1 </title>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- Ejercicio 1: crea un formulario de registro con nombre, correo, password y confirmación visual de 
términos.  -->

</head>

<body>

    <main class="form-page">

        <div class="form-container">

            <header class="form-header">
                <h1>
                    Formulario identidad
                </h1>
                <p>
                    Complete el formulario, llenar los campos obligatorios
                </p>
            </header>


            <form class="contact-form" action="#" method="POST">

                <div class="form-field">
                    <h2>
                        Datos personales

                    </h2>
                    <label for="nombre"> Nombre:
                        <input type="text" id="nombre" name="nombre" autocomplete="given-name" placeholder="Julian"
                            required autocomplete="name">

                    </label>

                </div>

                <div class="form-field">

                    <label for="email"> Correo electronico:
                        <input type="email" id="email" name="email" placeholder="julian@gmail.com" autocomplete="email"
                            required>
                    </label>

                </div>

                <div class="form-field">
                    <label for="password"> Contraseña:
                        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password"
                            required>
                    </label>
                </div>

                <!-- Terminos -->
                <label class="choice">
                    <input type="checkbox" name="terminos" required>
                    <span> Acepto el tratamiento de la informacion suministrada </span>
                </label>

                <!-- Botones -->
                <div class="form-actions">
                    <button type="submit" class="button button-primary">
                        Enviar solicitud
                    </button>
                    <button type="reset" class="button button-secondary">
                        Limpiar
                    </button>

                </div>


            </form>

    </main>

</body>


</html>
